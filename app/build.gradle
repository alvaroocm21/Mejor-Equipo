plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mejorequipo.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mejorequipo.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Se firma con la clave de debug para poder instalar el APK directamente.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
